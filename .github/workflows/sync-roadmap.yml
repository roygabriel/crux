name: Sync Roadmap

on:
    schedule:
        # Run at 6am and 6pm UTC daily
        - cron: "0 6,18 * * *"
    workflow_dispatch: # Allow manual trigger

permissions:
    contents: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Fetch roadmap data
              env:
                  PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
              run: node scripts/fetch-roadmap.mjs

            - name: Check for changes
              id: diff
              run: |
                  git diff --quiet site/src/data/roadmap.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

            - name: Commit and push
              if: steps.diff.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add site/src/data/roadmap.json
                  git commit -m "chore: sync roadmap from GitHub Projects"
                  git push
