# Crux orchestrator default configuration.
# Override any value with CRUX_ environment variables.
# Example: CRUX_MEMORY_SQLITE_PATH overrides memory.sqlite_path.

project:
  name: "my-project"
  root: "."
  state_dir: ".crux"

agents: {}
  # Example:
  #   engineer-1:
  #     plugin: claude
  #     role: engineer
  #     permission: standard
  #   reviewer-1:
  #     plugin: claude
  #     role: reviewer
  #     permission: readonly

memory:
  sqlite_path: ".crux/memory.db"
  vector_dir: ".crux/vectors"
  embedding_provider: "chromem-default"
  embedding_model: "nomic-embed-text"

phases:
  spec_dir: "docs/phases"

security:
  audit_log: ".crux/audit.log"
  max_cmds_per_min: 60
  max_files_per_session: 100
  allowed_paths: []
  denied_paths:
    - ".git/"
    - ".env"
    - ".crux/audit.log"

execution:
  deterministic_enabled: true
  run_timeout: 7m
  idle_timeout: 90s
  startup_inflight_grace: 20s

# Context token budgets for orchestrator prompts.
# context:
#   total_budget: 8000
#   world_state: 300
#   decision_rag: 1500
#   summary: 3000
#   reserve: 3200
#   ready_timeout: 20s
