<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- Central hub -->
  <circle cx="32" cy="32" r="8" fill="url(#g1)"/>
  <!-- Orbital ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#g1)" stroke-width="2.5" fill="none" opacity="0.6"/>
  <!-- Top node -->
  <circle cx="32" cy="10" r="5" fill="url(#g2)"/>
  <!-- Bottom-left node -->
  <circle cx="12.9" cy="43" r="5" fill="url(#g2)"/>
  <!-- Bottom-right node -->
  <circle cx="51.1" cy="43" r="5" fill="url(#g2)"/>
  <!-- Connection lines -->
  <line x1="32" y1="24" x2="32" y2="15" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="25.5" y1="37" x2="16.5" y2="40.5" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38.5" y1="37" x2="47.5" y2="40.5" stroke="url(#g1)" stroke-width="2" stroke-linecap="round"/>
  <!-- Cross lines for "crux" symbolism -->
  <line x1="22" y1="22" x2="42" y2="42" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <line x1="42" y1="22" x2="22" y2="42" stroke="url(#g2)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>